services:
  medici:
    build: .
    container_name: medici
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/medici.db
    volumes:
      - medici-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  medici-data:
