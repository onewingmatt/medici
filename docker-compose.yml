services:
  medici:
    build: .
    container_name: medici
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/medici.db
    volumes:
      - medici-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://[::1]:3001/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  medici-data:
